[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="vibe-player"
version="5.0.0"
description="Privacy-focused ad-free desktop music player"
requires-python=">=3.10"
dependencies=["PySide6>=6.8,<7","PySide6-WebEngine>=6.8,<7","requests>=2.32,<3","yt-dlp>=2024.1"]

[project.optional-dependencies]
test=["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths=["tests"]

[tool.setuptools.packages.find]
include=["vibe*"]
